# Render Blueprint — 一键部署 PatchPilot 到公共云
# 在 Render 里 New → Blueprint，选本仓库即可上线；NEBIUS_API_KEY / TAVILY_API_KEY 留待控制台填写。
services:
  - type: web
    name: patchpilot
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python server.py"
    healthCheckPath: /healthz
    envVars:
      # NVIDIA Nemotron 经 Nebius Token Factory（OpenAI 兼容）。留空则用离线 Linter，功能完整。
      - key: NEBIUS_BASE
        value: https://api.tokenfactory.nebius.com/v1/
      - key: NEBIUS_MODEL
        value: nvidia/nemotron-3-super-120b-a12b
      - key: NEBIUS_API_KEY
        sync: false
      # 可选：Tavily 检索增强（Best Use of Tavily）
      - key: TAVILY_API_KEY
        sync: false
